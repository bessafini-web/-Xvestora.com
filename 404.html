<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Xvestora</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/images/xvestora_logo_transparent.png" />
  <link rel="stylesheet" href="pages.css?v=2" />
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.2rem;
    }
    .notfound__code {
      font-family: var(--font-display);
      font-size: 5rem;
      font-weight: 300;
      color: var(--bronze);
      line-height: 1;
    }
    .notfound__title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 400;
      color: var(--text);
    }
    .notfound__desc {
      font-size: .95rem;
      color: var(--text-70);
      max-width: 420px;
    }
    .notfound__actions {
      display: flex;
      gap: 1rem;
      margin-top: .8rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="notfound">
    <div class="notfound__code">404</div>
    <h1 class="notfound__title">Page Not Found</h1>
    <p class="notfound__desc">The page you are looking for does not exist or has moved.</p>
    <div class="notfound__actions">
      <a href="/" class="btn btn--primary">Go to Homepage (EN)</a>
      <a href="/fr/" class="btn btn--ghost">Aller à l'accueil (FR)</a>
    </div>
  </div>
</body>
</html>
